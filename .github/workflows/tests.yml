# The kit's own suites, on every push and pull request. Owner-authored: the kit never writes this file.
# Actions are pinned by full commit SHA (verified with `git ls-remote` on 2026-10-16); the comment
# names the release each SHA is.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: a git identity, for the suites that commit inside their scratch repositories
        run: |
          git config --global user.name "kit tests"
          git config --global user.email "kit-tests@users.noreply.github.com"
      - name: unit
        run: python -B -m pytest -p no:cacheprovider tests/unit -q
      - name: acceptance
        run: python -I -B tests/acceptance/fresh-repo/parallel.py
